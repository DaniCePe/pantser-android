<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#160D0A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pantser</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <button id="btn-settings" class="icon-btn" aria-label="settings">&#9881;</button>
    <div id="topbar-title">Pantser</div>
    <button id="btn-info" class="icon-btn" aria-label="info">&#9432;</button>
  </header>

  <main id="stage">
    <div id="pager" class="pager">
      <section id="view-home" class="view page">
        <div id="home-chips"></div>
        <div class="prompt" id="home-prompt"></div>
        <div class="layout-line" id="home-layout"></div>
        <div class="privacy" id="home-privacy"></div>
        <div id="home-inputs"></div>
        <button id="btn-jump" class="link-btn hidden"></button>
        <button id="btn-create" class="primary"></button>
        <div class="tray">
          <div class="tray-title" id="tray-title"></div>
          <div id="tray-list"></div>
        </div>
      </section>
      <section id="view-items" class="view page">
        <h2 id="items-title"></h2>
        <p class="sub" id="items-sub"></p>
        <div id="items-form">
          <input type="text" id="items-input-item" autocomplete="off">
          <input type="text" id="items-input-desc" autocomplete="off">
          <input type="text" id="items-input-qty" autocomplete="off" inputmode="numeric">
        </div>
        <button id="btn-items-create" class="primary"></button>
        <div class="tray">
          <div class="tray-title" id="items-hist-title"></div>
          <div id="items-hist-list"></div>
        </div>
      </section>
      <section id="view-insights" class="view page">
        <h2 id="ins-title"></h2>
        <p class="sub" id="ins-sub"></p>
        <div class="cards" id="ins-cards"></div>
        <h3 id="ins-most"></h3>
        <div id="ins-list"></div>
        <div class="storage" id="ins-storage"></div>
      </section>
    </div>

    <section id="view-settings" class="view overlay hidden">
      <div class="pager" id="settings-pager">
        <div class="page"><h2 class="sec-title" id="set-util-title"></h2><div id="set-util-list" class="set-list"></div></div>
        <div class="page"><h2 class="sec-title" id="set-storage-title"></h2><div id="set-storage-list" class="set-list"></div></div>
        <div class="page"><h2 class="sec-title" id="set-appear-title"></h2><div id="set-appear-list" class="set-list"></div></div>
        <div class="page"><h2 class="sec-title" id="set-adv-title"></h2><div id="set-adv-list" class="set-list"></div></div>
      </div>
      <button id="settings-arrow-prev" class="pager-arrow left" type="button">&#8249;</button>
      <button id="settings-arrow-next" class="pager-arrow right" type="button">&#8250;</button>
      <div class="dots" id="settings-dots"></div>
    </section>

    <section id="view-info" class="view overlay hidden">
      <div class="pager" id="info-pager">
        <div class="page"><h2 id="info-t1"></h2><p id="info-b1a"></p><h3 id="info-t2"></h3><p id="info-b2"></p></div>
        <div class="page"><h2 id="info-t3"></h2><p id="info-b3"></p></div>
        <div class="page"><h2 id="info-t4"></h2><p id="info-b4"></p></div>
      </div>
      <button id="info-arrow-prev" class="pager-arrow left" type="button">&#8249;</button>
      <button id="info-arrow-next" class="pager-arrow right" type="button">&#8250;</button>
      <div class="dots" id="info-dots"></div>
      <p class="info-version" id="info-version"></p>
      <div class="info-update">
        <button id="btn-update" class="btn-update" type="button"></button>
        <p class="update-status" id="update-status"></p>
      </div>
    </section>
  </main>

  <nav id="dock">
    <button id="tab-create" class="tab"></button>
    <button id="tab-items" class="tab"></button>
    <button id="tab-insights" class="tab"></button>
  </nav>
</div>

<iframe id="print-frame" class="hidden" title="print"></iframe>
<div id="print-sheet"></div>
<div id="toast" class="hidden"></div>
<div id="dlg-backdrop" class="hidden">
  <div id="dlg">
    <div id="dlg-title"></div>
    <div id="dlg-msg"></div>
    <div id="dlg-list"></div>
    <div id="dlg-btns"></div>
  </div>
</div>

<script src="js/pdf-lib.min.js"></script>
<script src="js/fontkit.umd.min.js"></script>
<script src="js/strings.js"></script>
<script src="js/strings-web.js"></script>
<script src="js/app.js"></script>
</body>
</html>
